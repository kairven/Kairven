<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kairven — Autonomous Digital Infrastructure for Growing Businesses</title>
    <meta
      name="description"
      content="Kairven builds AI-powered front desk systems, search visibility and CRM pipelines for clinics, home services and local businesses."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://kairven.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Kairven" />
    <meta
      property="og:description"
      content="Stop losing leads to silence. Automated response, 24/7."
    />
    <meta property="og:url" content="https://kairven.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairven" />
    <meta property="og:locale" content="en_IN" />
    <!--
      Absolute URL is mandatory: Facebook, LinkedIn, Slack and WhatsApp all
      resolve og:image against the *crawler's* origin if it's relative, so a
      relative path silently yields no preview. 1200×630 is the ratio those
      crawlers crop to.
    -->
    <meta property="og:image" content="https://kairven.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://kairven.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kairven — autonomous digital infrastructure" />

    <!-- Twitter / X. summary_large_image needs its own image tag;
         legacy crawlers read twitter:image, not og:image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kairven" />
    <meta
      name="twitter:description"
      content="Stop losing leads to silence. Automated response, 24/7."
    />
    <meta name="twitter:image" content="https://kairven.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Kairven — autonomous digital infrastructure" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
