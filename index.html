<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />

    <title>Kairven — Autonomous Digital Infrastructure for Growing Businesses</title>
    <meta
      name="description"
      content="Kairven builds AI-powered front desk systems, search visibility and CRM pipelines for clinics, home services and local businesses."
    />
    <link rel="canonical" href="https://kairven.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:site_name" content="Kairven" />
    <meta property="og:title" content="Kairven" />
    <meta property="og:description" content="Stop losing leads to silence. Automated response, 24/7." />
    <meta property="og:image" content="https://kairven.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kairven — AI front desk infrastructure for growing businesses" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kairven.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kairven" />
    <meta name="twitter:description" content="Stop losing leads to silence. Automated response, 24/7." />
    <meta name="twitter:image" content="https://kairven.com/og-image.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Preload ONLY the two files on the critical path: the body variable weight
      (used by the LCP headline) and the mono 400 used by the hero eyebrow.
      Everything else is discovered by the CSS and cached for a year.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      AEO/GEO: structured, unambiguous facts — not marketing copy. This is the
      shape answer engines quote. FAQPage mirrors the visible FAQ strings
      exactly; keep the two in sync when copy changes.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://kairven.com/#organization",
        "name": "Kairven",
        "url": "https://kairven.com/",
        "description": "Digital infrastructure and automation for clinics, home services, and local businesses.",
        "founder": { "@type": "Person", "name": "Mohammad Sameer Khan" },
        "areaServed": { "@type": "Country", "name": "India" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kanpur",
          "addressRegion": "Uttar Pradesh",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "AI front desk automation",
          "WhatsApp lead response",
          "Local SEO and generative engine optimization",
          "CRM pipeline automation"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Signal",
            "description": "WhatsApp and missed-call capture with AI front desk and calendar booking for a single location.",
            "price": "24000",
            "priceCurrency": "INR"
          },
          {
            "@type": "Offer",
            "name": "Autonomous",
            "description": "Unified multi-channel front desk, CRM ledger, review and reactivation automation, local SEO maintenance.",
            "price": "56000",
            "priceCurrency": "INR"
          },
          {
            "@type": "Offer",
            "name": "Compound",
            "description": "Multi-location routing, custom intent graph, dedicated automation engineer.",
            "price": "118000",
            "priceCurrency": "INR"
          }
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does Kairven actually build?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kairven builds and operates the digital infrastructure that sits between a business and its customers: an AI front desk that answers and books, a unified lead ledger with CRM sync, and search visibility work so the business is found and cited. It is delivered as a managed service, not a DIY tool."
            }
          },
          {
            "@type": "Question",
            "name": "Which businesses does Kairven work with?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kairven focuses on appointment-driven local businesses in India — dental and dermatology clinics, diagnostics labs, home services such as HVAC, plumbing and interior work, and similar operators where a missed enquiry is a missed booking."
            }
          },
          {
            "@type": "Question",
            "name": "How fast can the AI front desk be live?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A single-location deployment typically goes live within 10 to 14 working days from kickoff. That window covers WhatsApp Business API verification, calendar mapping, intent-graph configuration and a scripted QA pass before anything is connected to real customers."
            }
          },
          {
            "@type": "Question",
            "name": "Does the AI talk to customers without a human?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It handles the high-frequency, low-ambiguity path — availability, pricing bands, service-area checks, booking, confirmation and rescheduling. Anything outside the configured confidence threshold is handed to a human with full conversation context instead of being guessed at."
            }
          },
          {
            "@type": "Question",
            "name": "Where is the business located?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kairven is based in Kanpur, Uttar Pradesh, India, and serves clients across India remotely. The founder is Mohammad Sameer Khan."
            }
          },
          {
            "@type": "Question",
            "name": "What happens in the free diagnostic?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You share your name, business and the single biggest leak in your lead flow. Kairven responds with a concrete audit of your capture, response and follow-up path, plus the two changes that would recover the most bookings. No obligation to continue."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
