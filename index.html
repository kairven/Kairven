<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kairven — Autonomous Digital Infrastructure for Growing Businesses</title>
    <meta
      name="description"
      content="Kairven builds AI-powered front desk systems, search visibility and CRM pipelines for clinics, home services and local businesses."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://kairven.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Kairven" />
    <meta
      property="og:description"
      content="Stop losing leads to silence. Automated response, 24/7."
    />
    <meta property="og:url" content="https://kairven.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairven" />
    <meta property="og:locale" content="en_IN" />
    <!--
      Absolute URL is mandatory: Facebook, LinkedIn, Slack and WhatsApp all
      resolve og:image against the *crawler's* origin if it's relative, so a
      relative path silently yields no preview. 1200×630 is the ratio those
      crawlers crop to.
    -->
    <meta property="og:image" content="https://kairven.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://kairven.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kairven — autonomous digital infrastructure" />

    <!-- Twitter / X. summary_large_image needs its own image tag;
         legacy crawlers read twitter:image, not og:image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kairven" />
    <meta
      name="twitter:description"
      content="Stop losing leads to silence. Automated response, 24/7."
    />
    <meta name="twitter:image" content="https://kairven.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Kairven — autonomous digital infrastructure" />

    <!--
      Structured data. A @graph (rather than three loose scripts) lets the
      Service nodes and the WebSite node point back at one canonical business
      @id, so Google resolves them as a single entity instead of three
      unrelated crumbs.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://kairven.com/#organization",
            "name": "Kairven",
            "url": "https://kairven.com/",
            "description": "Digital infrastructure and automation for clinics, home services, and local businesses.",
            "image": "https://kairven.com/og-image.jpg",
            "logo": "https://kairven.com/apple-touch-icon.png",
            "founder": {
              "@type": "Person",
              "name": "Mohammad Sameer Khan"
            },
            "areaServed": {
              "@type": "Country",
              "name": "India"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kanpur",
              "addressRegion": "Uttar Pradesh",
              "addressCountry": "IN"
            },
            "knowsAbout": [
              "AI front desk automation",
              "Local search visibility",
              "CRM pipeline automation"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Kairven services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "AI front desk systems",
                    "description": "24/7 automated response for inbound enquiries across WhatsApp, calls and web forms.",
                    "serviceType": "Business process automation",
                    "areaServed": { "@type": "Country", "name": "India" },
                    "provider": { "@id": "https://kairven.com/#organization" }
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Search visibility",
                    "description": "Local SEO and structured data so the business surfaces in search and map results.",
                    "serviceType": "Search engine optimisation",
                    "areaServed": { "@type": "Country", "name": "India" },
                    "provider": { "@id": "https://kairven.com/#organization" }
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "CRM pipelines",
                    "description": "Lead capture, enrichment and routing into a single pipeline.",
                    "serviceType": "CRM integration",
                    "areaServed": { "@type": "Country", "name": "India" },
                    "provider": { "@id": "https://kairven.com/#organization" }
                  }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://kairven.com/#website",
            "url": "https://kairven.com/",
            "name": "Kairven",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://kairven.com/#organization" }
          }
        ]
      }
    </script>

    <!--
      Self-hosted, Latin-subset variable fonts. Preloading the *body* face only:
      it is what the LCP heading renders in. The mono face is used for small
      telemetry labels far below the fold, so preloading it would just compete
      for bandwidth during the critical window.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      FAQPage. Only emit this for questions genuinely visible on the page —
      markup describing content that isn't rendered is a guidelines violation
      and gets the domain penalised for spam, not rewarded.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://kairven.com/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does Kairven actually build?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Three things that share one pipeline: an AI front desk that answers enquiries 24/7, local search visibility so the business is found, and a CRM pipeline that routes every lead somewhere it will be followed up."
            }
          },
          {
            "@type": "Question",
            "name": "Which businesses is this for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Clinics, home services and local businesses in India that lose enquiries to slow or missed replies. If you answer every message within minutes, you do not need this."
            }
          },
          {
            "@type": "Question",
            "name": "How long does setup take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Typically two to three weeks from kickoff, covering the WhatsApp and form intake, the knowledge base for automated replies, and the CRM handoff. Search visibility work runs longer because it depends on indexing."
            }
          },
          {
            "@type": "Question",
            "name": "Do you replace my existing CRM?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Kairven routes into the CRM you already use. If there isn't one, a lightweight pipeline is set up as part of the engagement."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
